name: Publish Package

on:
  release:
    types:
      - published
  workflow_dispatch: # enables manual triggering

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install toml requests packaging

      - name: Validate Version
        run: |
          if curl -s -f https://pypi.org/pypi/views_r2darts2/json > /dev/null; then
            latest_version=$(curl -s https://pypi.org/pypi/views_r2darts2/json | jq -r .info.version)
          else
            latest_version="0.1.0"  # First release fallback
          fi
          new_version=$(python -c "import toml; print(toml.load('pyproject.toml')['tool']['poetry']['version'])")
          echo "Latest PyPI version: $latest_version"
          echo "New version: $new_version"
          python -c "from packaging.version import parse; assert parse('$new_version') > parse('$latest_version'), 'Version must be higher than $latest_version'"

      - name: Publish to PyPI
        run: poetry publish --build --username __token__ --password ${{ secrets.PYPI_TOKEN }}