[tool.poetry]
name = "views_r2darts2"
version = "0.2.1"
description = "Neural network based forecasting models for the VIEWS platform"
authors = [
    "Dylan Pinheiro <dylpin@prio.org>",
    "Xiaolong Sun <xiaolong.sun@pcr.uu.se>",
    "Borbála Farkas <borbala.farkas@pcr.uu.se>"
]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
darts = { version = "==0.46.1", extras = ["torch"] }   # declares torch + pytorch-lightning, imported at module level
dask = ">=2026.7.1"
pyarrow = ">=14.0.0"
scikit-learn = ">=1.6.0,<1.10.0"
numpy = ">=1.26.0"   # imported throughout; floor copied from darts 0.46.1 (arrived transitively before)
pandas = ">=2.2.0"   # imported in dataset/converters.py, readers.py, base.py, transformers/darts_bridge.py; floor copied from darts 0.46.1
xarray = ">=2026.7.0"
zarr = ">=3.0"   # module-level import in dataset/converters.py; xarray 2026.x needs zarr>=3
views-frames = ">=1.10.2,<2.0.0"   # the range views-pipeline-core requires; 2.x is untested here (issue #34)
wandb = ">=0.18.7"   # floor only, compatible with views-pipeline-core (^0.18.7); needed by catalogs/model_catalog.py:204 outside the manager path (issue #34)
views-pipeline-core = { version = ">=3.0.0,<4.0.0", optional = true }

[tool.poetry.extras]
# Install with `poetry install --extras manager` to enable the model manager.
manager = ["views-pipeline-core"]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
pyarrow = ">=14.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::UserWarning:sklearn.preprocessing._function_transformer",
    "ignore::DeprecationWarning:darts",
    "ignore::UserWarning:pytorch_lightning",
]