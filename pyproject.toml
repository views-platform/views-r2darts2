[tool.poetry]
name = "views_r2darts2"
version = "0.2.0"
description = "Neural network based forecasting models for the VIEWS platform"
authors = [
    "Dylan Pinheiro <dylpin@prio.org>",
    "Xiaolong Sun <xiaolong.sun@pcr.uu.se>",
    "Borbála Farkas <borbala.farkas@pcr.uu.se>"
]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
darts = "==0.46.1"
dask = ">=2026.7.1"
pyarrow = ">=14.0.0"
scikit-learn = ">=1.6.0,<1.10.0"
xarray = ">=2026.7.0"
views-frames = ">=0.1.0"
wandb = ">=0.28.2"
views-pipeline-core = { version = ">=3.0.0,<4.0.0", optional = true }

[tool.poetry.extras]
# Install with `poetry install --extras manager` to enable the model manager.
manager = ["views-pipeline-core"]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
pyarrow = ">=14.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::UserWarning:sklearn.preprocessing._function_transformer",
    "ignore::DeprecationWarning:darts",
    "ignore::UserWarning:pytorch_lightning",
]