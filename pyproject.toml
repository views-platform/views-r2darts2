[tool.poetry]
name = "views_r2darts2"
version = "0.2.2"
description = "Neural network based forecasting models for the VIEWS platform"
authors = [
    "Dylan Pinheiro <dylpin@prio.org>",
    "Xiaolong Sun <xiaolong.sun@pcr.uu.se>",
    "Borbála Farkas <borbala.farkas@pcr.uu.se>"
]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
darts = { version = "==0.40.0", extras = ["torch"] }   # the newest darts the platform can host (viewser/vtl pin pandas<2); patches.py verified on 0.40
dask = { version = ">=2024.1.0,<2024.4.0", extras = ["dataframe"] }   # dask.array only; dataframe extra kept for downstream; toolz>=0.10 (viewser caps <0.12)
pyarrow = ">=14.0.0"
scikit-learn = ">=1.6.0,<1.10.0"
numpy = ">=1.26.0,<2.0.0"   # viewser caps numpy<2
pandas = ">=1.5.0,<2.0.0"   # the platform (viewser, views-transformation-library) is pandas 1
xarray = ">=2024.1.0,<2024.5.0"   # 2024.3.0 is the last xarray accepting pandas 1; views-datafactory needs >=2024.1,<2026
zarr = ">=2.16,<3.0"   # views-datafactory caps zarr<3; stores are written in zarr v2 format
views-frames = ">=1.10.2,<2.0.0"   # the range views-pipeline-core requires; 2.x is untested here (issue #34)
wandb = ">=0.18.7"   # floor only, compatible with views-pipeline-core (^0.18.7); needed by catalogs/model_catalog.py:204 outside the manager path (issue #34)
rich = ">=13.0"   # console diagnostics in infrastructure/callbacks.py (RichLossDiagnosticsCallback); was imported but never declared
views-pipeline-core = { version = ">=3.0.0,<4.0.0", optional = true }

[tool.poetry.extras]
# Install with `poetry install --extras manager` to enable the model manager.
manager = ["views-pipeline-core"]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
pyarrow = ">=14.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::UserWarning:sklearn.preprocessing._function_transformer",
    "ignore::DeprecationWarning:darts",
    "ignore::UserWarning:pytorch_lightning",
]