[tool.poetry]
name = "views_r2darts2"
version = "0.2.0"
description = "Darts-based forecasting for the VIEWS platform"
authors = [
    "Dylan Pinheiro <dylpin@prio.org>",
    "Xiaolong Sun <xiaolong.sun@pcr.uu.se>",
    "Borbála Farkas <borbala.farkas@pcr.uu.se>"
]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
# views-frames is the new data-contract layer (numpy-only, memmap-backed).
# Replaces the legacy pandas DataFrame held by _ViewsDataset.
views-frames = ">=0.1.0"
# views-pipeline-core is required only for DartsForecastingModelManager
# (the experiment orchestrator). The rest of the package is importable
# without it — the manager lazy-imports its parent class.
views-pipeline-core = { version = ">=3.0.0,<4.0.0", optional = true }
darts = "==0.46.1"
scikit-learn = ">=1.6.0, <1.10.0"
pyarrow = ">=14.0.0"
numpy = ">=2.2.6, <3.0.0"
pandas = ">=3.0.0,<4.0.0"
dask = ">=2026.7.1"
xarray = ">=2026.7.0"

[tool.poetry.extras]
# Install with `poetry install --extras manager` to enable the model manager.
manager = ["views-pipeline-core"]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
pyarrow = ">=14.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::UserWarning:sklearn.preprocessing._function_transformer",
    "ignore::DeprecationWarning:darts",
    "ignore::UserWarning:pytorch_lightning",
]
